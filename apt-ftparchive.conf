// apt-ftparchive configuration for the `release` subcommand.
//
// Only sets the Release-file metadata fields we want stamped on every publish.
// The `packages` subcommand (called separately, per-architecture, in
// scripts/publish.sh) does not need this config.
//
// Notes on omissions:
//   - No Valid-Until: skipping an expiration means we don't have to publish
//     on a fixed cadence to keep the repo "fresh" for apt-secure. See
//     docs/reference/release-fields.md for the rationale.
//   - No DoByHash: by-hash directories add atomicity guarantees during the
//     metadata-upload window. Our origin is single-writer GCS with sequential
//     atomic uploads (InRelease last), and Cloudflare bypasses cache for
//     dists/*, so the race window is negligible. Re-enable here if we ever
//     add mirrors.

APT::FTPArchive::Release {
    Origin "charliek";
    Label "charliek apt repo";
    Suite "noble";
    Codename "noble";
    Architectures "amd64 arm64";
    Components "main";
    Description "Debian/Ubuntu apt repository for charliek open-source projects";
};
