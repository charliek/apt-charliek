# Tracked packages for apt-charliek.
#
# Adding a package: append an entry below, then make sure the source repo's
# release flow attaches a matching .deb to its GitHub release and fires a
# repository_dispatch at this repo on each release. See
# docs/guides/adding-a-package.md for the full contract.

suite: noble
component: main
architectures: [amd64, arm64]
origin: charliek
label: charliek apt repo
description: "Debian/Ubuntu apt repository for charliek open-source projects"

packages:
  - name: prox
    repo: charliek/prox
    glob: "prox_*.deb"
    include_prerelease: false
  - name: envsecrets
    repo: charliek/envsecrets
    glob: "envsecrets_*.deb"
    include_prerelease: false
  - name: shed-server
    repo: charliek/shed
    glob: "shed-server_*.deb"
    include_prerelease: false
  - name: roost
    repo: charliek/roost
    glob: "roost_*.deb"
    include_prerelease: false
  - name: strix
    repo: charliek/strix
    glob: "strix_*.deb"
    include_prerelease: false
  - name: codelens
    repo: charliek/codelens
    glob: "codelens_*.deb"
    include_prerelease: false
  - name: sx
    repo: charliek/shed
    glob: "sx_*.deb"
    include_prerelease: false
    # The RC session porcelain — took over the brew+apt slot shed-machine-rc
    # vacated when that component was retired (charliek/shed plan 010/011).
    # optional until the first sx-shipping tag exists: sx ships on its own
    # manifest selector (crates/sx/VERSION), so charliek/shed's latest release
    # legitimately carries no sx_*.deb until one is cut. FLIP TO false once it
    # has shipped once, so a later regression fails loudly again.
    optional: true
  - name: shed-desktop
    repo: charliek/shed
    glob: "shed-desktop_*.deb"
    include_prerelease: false
    # macOS app; pending its first Linux .deb. Until it ships one, its .dmg-only
    # releases must not fail the collect. Remove once it reliably ships a .deb
    # (so a later regression fails loudly again).
    optional: true
